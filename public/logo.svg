<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <clipPath id="photoClip">
      <rect x="12" y="12" width="76" height="76" rx="16"/>
    </clipPath>
    <pattern id="checker" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="5" height="5" fill="#d1d5db"/>
      <rect x="5" y="0" width="5" height="5" fill="#f3f4f6"/>
      <rect x="0" y="5" width="5" height="5" fill="#f3f4f6"/>
      <rect x="5" y="5" width="5" height="5" fill="#d1d5db"/>
    </pattern>
  </defs>
  
  <!-- 照片主体（蓝色圆角矩形） -->
  <rect x="12" y="12" width="76" height="76" rx="16" fill="#3b82f6"/>
  
  <!-- 照片内容 -->
  <g clip-path="url(#photoClip)">
    <circle cx="36" cy="36" r="9" fill="white" opacity="0.9"/>
    <path d="M 12 75 L 38 50 L 52 62 L 68 44 L 88 75 Z" fill="white" opacity="0.9"/>
  </g>
  
  <!-- 被撕开的角（右上角三角形） -->
  <path d="M 58 12 L 88 12 L 88 42 Z" fill="#e5e7eb"/>
  <path d="M 58 12 L 88 12 L 88 42 Z" fill="url(#checker)"/>
  
  <!-- 撕开的折痕阴影 -->
  <line x1="58" y1="12" x2="88" y2="42" stroke="#9ca3af" stroke-width="1.5" opacity="0.6"/>
</svg>