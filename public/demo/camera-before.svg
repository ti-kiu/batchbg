<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#E0E8F5"/>
  <!-- Camera body -->
  <g transform="translate(140, 100)">
    <!-- Main body -->
    <rect x="20" y="60" width="280" height="180" rx="15" fill="#2C2C2C"/>
    <!-- Top housing / pentaprism -->
    <path d="M100 60 L120 15 L220 15 L240 60" fill="#3A3A3A" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Viewfinder -->
    <rect x="145" y="20" width="50" height="30" rx="4" fill="#1A1A1A"/>
    <!-- Lens barrel -->
    <circle cx="160" cy="150" r="65" fill="#1A1A1A" stroke="#333" stroke-width="3"/>
    <circle cx="160" cy="150" r="50" fill="#2C2C2C" stroke="#444" stroke-width="2"/>
    <circle cx="160" cy="150" r="35" fill="#1A1A1A"/>
    <circle cx="160" cy="150" r="22" fill="#292929"/>
    <!-- Lens reflection -->
    <circle cx="148" cy="138" r="8" fill="#4A4A4A" opacity="0.6"/>
    <!-- Shutter button -->
    <circle cx="230" cy="50" r="12" fill="#D44040"/>
    <!-- Mode dial -->
    <rect x="80" y="45" width="30" height="18" rx="4" fill="#444"/>
    <!-- Grip texture -->
    <rect x="260" y="80" width="30" height="140" rx="8" fill="#333"/>
    <line x1="268" y1="90" x2="268" y2="210" stroke="#444" stroke-width="1"/>
    <line x1="275" y1="90" x2="275" y2="210" stroke="#444" stroke-width="1"/>
    <line x1="282" y1="90" x2="282" y2="210" stroke="#444" stroke-width="1"/>
    <!-- Hot shoe -->
    <rect x="140" y="7" width="60" height="10" rx="2" fill="#888"/>
    <!-- Brand mark -->
    <rect x="110" y="72" width="50" height="6" rx="2" fill="#555"/>
  </g>
  <text x="300" y="380" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">Camera — Before</text>
</svg>
